aid: sprinter-health
name: Sprinter Health
description: Sprinter Health is an in-home preventive and diagnostic healthcare company
  that pairs trained community health workers ("Sprinters") who visit patients at home
  with a virtual team of physicians, nurses, and care navigators. Its hybrid Sprinter
  Care+ model delivers vitals, blood draws, ECGs, cancer and diabetic screenings, wellness
  visits, medication reconciliation, care-gap closure, health risk assessments, and
  social-needs screening, and partners with health plans such as Humana, Molina Healthcare,
  and Anthem. Backed by a16z, Accel, General Catalyst, and GV. No public developer or
  API surface was found during enrichment; this profile captures the company's identity,
  security posture, and legal/trust properties.
